<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>20L — Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2C16 2 6 15 6 21a10 10 0 0 0 20 0C26 15 16 2 16 2Z' fill='%231C6E8C'/%3E%3Cpath d='M16 6C16 6 9.5 15.8 9.5 21A6.5 6.5 0 0 0 22.5 21C22.5 15.8 16 6 16 6Z' fill='%23F5F2EA' fill-opacity='0.18'/%3E%3Ccircle cx='13' cy='22' r='2' fill='%23F4B942'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
  :root{
    --ink:#142433; --paper:#F5F2EA; --bottle:#1C6E8C; --bottle-deep:#0F4C61;
    --cap:#F4B942; --cap-deep:#D69A1F; --mist:#E4EEF0; --line:#D8D2C4;
    --good:#3E8E5A; --bad:#B4482F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid var(--bottle); outline-offset:2px; }
  .wrap{ max-width:1040px; margin:0 auto; padding:0 24px; }

  header{ border-bottom:1px solid var(--line); padding:16px 0; }
  .nav{ display:flex; align-items:center; justify-content:space-between; max-width:1040px; margin:0 auto; padding:0 24px; }
  .brand{ display:flex; align-items:baseline; gap:6px; font-size:20px; font-weight:700; }
  .brand .dot{ color:var(--cap-deep); }
  .nav-account{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .nav-account button{ background:none; border:1.5px solid var(--ink); border-radius:999px; padding:7px 14px; font-weight:600; font-size:13px; }
  .nav-account .who{ color:#5A6672; }

  .admin{ padding:40px 0 60px; }
  .admin h2{ font-size:26px; margin-bottom:6px; }
  .admin .lede{ color:#5A6672; font-size:14.5px; margin-bottom:24px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:#5A6672; margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-family:'Inter',sans-serif; font-size:15px; }
  .field input:focus, .field select:focus{ border-color:var(--bottle); }

  .confirm-btn{ width:100%; padding:15px; border-radius:10px; background:var(--cap); border:none; font-weight:700; font-size:15px; box-shadow:0 2px 0 var(--cap-deep); }
  .form-status{ font-size:13px; margin-top:10px; }
  .form-status.err{ color:var(--bad); }
  .form-status.ok{ color:var(--good); }
  .admin-login{ max-width:360px; }
  .admin-tabs{ display:flex; gap:10px; margin-bottom:22px; }
  .admin-tab{ padding:10px 18px; border-radius:999px; border:1.5px solid var(--line); background:var(--mist); font-weight:600; font-size:13.5px; }
  .admin-tab.active{ background:var(--bottle); border-color:var(--bottle); color:#fff; }
  .danger-btn{ padding:12px 18px; border-radius:10px; border:1.5px solid var(--bad); background:#fff; color:var(--bad); font-weight:600; }
  .danger-btn:hover{ background:var(--bad); color:#fff; }
  .detail-actions{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .row-delete{ background:none; border:none; color:var(--bad); font-size:12px; text-decoration:underline; }

  table.orders-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.orders-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#8A97A0; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.orders-table td{ padding:10px; border-bottom:1px solid var(--line); }
  table.orders-table tr.clickable{ cursor:pointer; }
  table.orders-table tr.clickable:hover{ background:var(--mist); }
  .badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 8px; border-radius:999px; text-transform:uppercase; }
  .badge.pending{ background:#FCEBC7; color:#8A5A00; }
  .badge.confirmed{ background:var(--mist); color:var(--bottle-deep); }
  .badge.delivered{ background:#DCEFE1; color:var(--good); }
  .badge.cancelled{ background:#F5DCD4; color:var(--bad); }
  .badge.unpaid{ background:#F5DCD4; color:var(--bad); }
  .badge.claimed{ background:#FCEBC7; color:#8A5A00; }

  .order-detail{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-top:18px; }
  .order-detail h4{ font-size:15px; margin-bottom:12px; }
  .order-detail .kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 10px; font-size:13.5px; margin-bottom:16px; }
  .order-detail .kv div:nth-child(odd){ color:#8A97A0; }
  .update-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px; }
  .update-row .field{ margin-bottom:0; min-width:150px; }
  .update-row button{ padding:12px 18px; border-radius:10px; border:none; background:var(--bottle); color:#fff; font-weight:600; }
  .history-note{ font-size:12px; color:#8A97A0; margin:16px 0 8px; text-transform:uppercase; letter-spacing:.05em; }

  .dev-banner{ background:#FCEBC7; color:#8A5A00; font-size:12.5px; text-align:center; padding:8px 16px; font-family:'IBM Plex Mono',monospace; }
</style>
</head>
<body>

<div id="devBanner" class="dev-banner" style="display:none;">
  ⚠ Supabase isn't configured — edit config.js with your project URL and anon key.
</div>

<header>
  <div class="nav">
    <div class="brand">20L<span class="dot">.</span> Admin</div>
    <div class="nav-account" id="navAccount"></div>
  </div>
</header>

<section class="admin">
  <div class="wrap">
    <h2>Order management</h2>
    <p class="lede" id="adminLede">Log in with an admin account to manage orders.</p>

    <div class="admin-login" id="adminLoginBox">
      <div class="field"><label for="adminEmail">Email</label><input type="email" id="adminEmail" placeholder="you@example.com"></div>
      <div class="field"><label for="adminPassword">Password</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
      <button class="confirm-btn" onclick="adminLogin()">Log in</button>
      <div class="form-status" id="adminLoginStatus"></div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div class="admin-tabs">
        <button class="admin-tab active" id="tabOrders" onclick="switchAdminTab('orders')">Orders</button>
        <button class="admin-tab" id="tabCustomers" onclick="switchAdminTab('customers')">Customers</button>
      </div>

      <div id="ordersTabPane">
        <div id="adminTableWrap"></div>
        <div id="orderDetail"></div>
      </div>

      <div id="customersTabPane" style="display:none;">
        <div id="customersTableWrap"></div>
        <div id="customerDetail"></div>
      </div>
    </div>
  </div>
</section>

<script>
// ---- global error catcher ----
window.addEventListener('error', function(e){
  let box = document.getElementById('jsErrorBox');
  if (!box){
    box = document.createElement('div');
    box.id = 'jsErrorBox';
    box.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:#b3261e; color:#fff; font-family:monospace; font-size:12px; padding:10px 14px; z-index:9999; white-space:pre-wrap;';
    document.body.appendChild(box);
  }
  box.textContent = 'JS error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
});

let db = null;
let currentUser = null;
let isAdmin = false;
const ITEM_LABEL = { new: 'New bottle', refill: 'Refill', combo: 'Combo (bottle + refill)' };
const DAY_LABELS = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };

try {
  const isConfigured = CONFIG.SUPABASE_URL.startsWith("http") && !CONFIG.SUPABASE_ANON_KEY.startsWith("YOUR_");
  if (isConfigured) {
    if (typeof window.supabase === 'undefined') throw new Error('Supabase library did not load');
    db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  } else {
    document.getElementById('devBanner').style.display = 'block';
  }
} catch (err) {
  console.error('Supabase init failed:', err);
  db = null;
  const banner = document.getElementById('devBanner');
  banner.textContent = '⚠ Could not connect to the database (offline, or the CDN script was blocked).';
  banner.style.display = 'block';
}

async function refreshSession(){
  if (!db) return;
  const { data: { session } } = await db.auth.getSession();
  currentUser = session ? session.user : null;
  if (currentUser){
    const { data: adminRow } = await db.from('admins').select('id').eq('id', currentUser.id).maybeSingle();
    isAdmin = !!adminRow;
  } else {
    isAdmin = false;
  }
  renderAccountUI();
  renderAdminGate();
}

function renderAccountUI(){
  const el = document.getElementById('navAccount');
  if (currentUser){
    el.innerHTML = `<span class="who">${currentUser.email}</span><button onclick="logOut()">Log out</button>`;
  } else {
    el.innerHTML = '';
  }
}

async function logOut(){
  if (db) await db.auth.signOut();
  currentUser = null;
  isAdmin = false;
  renderAccountUI();
  renderAdminGate();
}

function switchAdminTab(tab){
  document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
  document.getElementById('tabCustomers').classList.toggle('active', tab === 'customers');
  document.getElementById('ordersTabPane').style.display = (tab === 'orders') ? 'block' : 'none';
  document.getElementById('customersTabPane').style.display = (tab === 'customers') ? 'block' : 'none';
  if (tab === 'customers') loadAllCustomers();
}

function renderAdminGate(){
  const loginBox = document.getElementById('adminLoginBox');
  const panel = document.getElementById('adminPanel');
  const lede = document.getElementById('adminLede');

  if (currentUser && isAdmin){
    loginBox.style.display = 'none';
    panel.style.display = 'block';
    lede.textContent = 'All orders, latest first. Click a row for full details.';
    loadAllOrders();
  } else if (currentUser && !isAdmin){
    loginBox.style.display = 'block';
    panel.style.display = 'none';
    lede.textContent = "This account isn't an admin. Log in with an admin account below.";
  } else {
    loginBox.style.display = 'block';
    panel.style.display = 'none';
    lede.textContent = 'Log in with an admin account to manage orders.';
  }
}

async function adminLogin(){
  const statusEl = document.getElementById('adminLoginStatus');
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  if (!email || !password){
    statusEl.textContent = 'Enter email and password.'; statusEl.className = 'form-status err'; return;
  }
  if (!db){ statusEl.textContent = 'Not connected.'; statusEl.className = 'form-status err'; return; }
  statusEl.textContent = 'Logging in…'; statusEl.className = 'form-status';
  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await refreshSession();
    if (!isAdmin) statusEl.textContent = "Logged in, but this account isn't an admin.";
    else statusEl.textContent = '';
  } catch (err){
    statusEl.textContent = err.message || 'Could not log in.';
    statusEl.className = 'form-status err';
  }
}

function renderOrdersTable(data){
  if (!data || data.length === 0){
    return '<p style="color:#8A97A0; font-size:13.5px;">No orders yet.</p>';
  }
  return `
    <table class="orders-table">
      <thead><tr><th>Date placed</th><th>Item</th><th>Qty</th><th>Delivery</th><th>Total</th><th>Status</th><th>Payment</th></tr></thead>
      <tbody>
        ${data.map(o => `
          <tr>
            <td>${new Date(o.created_at).toLocaleDateString()}</td>
            <td>${ITEM_LABEL[o.item_type] || o.item_type}</td>
            <td>${o.quantity}</td>
            <td>${o.order_mode === 'recurring' ? `every ${DAY_LABELS[o.recurring_day] || o.recurring_day}` : o.delivery_date}</td>
            <td class="mono">₹${o.total_amount}</td>
            <td><span class="badge ${o.status}">${o.status}</span></td>
            <td><span class="badge ${o.payment_status}">${o.payment_status}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

let allOrdersCache = [];

async function loadAllOrders(){
  const wrap = document.getElementById('adminTableWrap');
  wrap.innerHTML = '<p style="color:#8A97A0; font-size:13.5px;">Loading…</p>';
  try {
    const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allOrdersCache = data || [];
    wrap.innerHTML = `
      <table class="orders-table">
        <thead><tr><th>Date</th><th>Customer</th><th>Room</th><th>Item</th><th>Qty</th><th>Total</th><th>Status</th><th>Payment</th></tr></thead>
        <tbody>
          ${allOrdersCache.map(o => `
            <tr class="clickable" onclick="openOrderDetail('${o.id}')">
              <td>${new Date(o.created_at).toLocaleDateString()}</td>
              <td>${o.customer_name}</td>
              <td>${o.hostel}, ${o.room_number}${o.wing}</td>
              <td>${ITEM_LABEL[o.item_type] || o.item_type}</td>
              <td>${o.quantity}</td>
              <td class="mono">₹${o.total_amount}</td>
              <td><span class="badge ${o.status}">${o.status}</span></td>
              <td><span class="badge ${o.payment_status}">${o.payment_status}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err){
    console.error('Load all orders failed:', err);
    wrap.innerHTML = `<p style="color:var(--bad); font-size:13.5px;">Could not load orders.</p>`;
  }
}

function renderGroupItemsWithDelete(items){
  if (!items || items.length === 0) return '<p style="color:#8A97A0; font-size:13.5px;">No items.</p>';
  return `
    <table class="orders-table">
      <thead><tr><th>Item</th><th>Qty</th><th>Delivery</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr></thead>
      <tbody>
        ${items.map(o => `
          <tr>
            <td>${ITEM_LABEL[o.item_type] || o.item_type}</td>
            <td>${o.quantity}</td>
            <td>${o.order_mode === 'recurring' ? `every ${DAY_LABELS[o.recurring_day] || o.recurring_day}` : o.delivery_date}</td>
            <td class="mono">₹${o.total_amount}</td>
            <td><span class="badge ${o.status}">${o.status}</span></td>
            <td><span class="badge ${o.payment_status}">${o.payment_status}</span></td>
            <td><button class="row-delete" onclick="deleteOrderLine('${o.id}', '${o.order_group_id}')">delete</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

async function openOrderDetail(orderId){
  const detailEl = document.getElementById('orderDetail');
  const order = allOrdersCache.find(o => o.id === orderId);
  if (!order) return;

  detailEl.innerHTML = '<p style="color:#8A97A0; font-size:13.5px;">Loading details…</p>';

  try {
    const [{ data: groupItems, error: groupErr }, { data: history, error: histErr }] = await Promise.all([
      db.from('orders').select('*').eq('order_group_id', order.order_group_id),
      db.from('orders').select('*').eq('customer_id', order.customer_id).order('created_at', { ascending: false })
    ]);
    if (groupErr) throw groupErr;
    if (histErr) throw histErr;

    detailEl.innerHTML = `
      <div class="order-detail">
        <div class="detail-actions">
          <h4>Order — ${order.customer_name}</h4>
          <button class="danger-btn" onclick="deleteWholeOrder('${order.order_group_id}')">Delete entire order</button>
        </div>
        <div class="kv">
          <div>Room</div><div>${order.hostel}, Room ${order.room_number}${order.wing}</div>
          <div>Phone</div><div>${order.phone}</div>
          <div>Placed</div><div>${new Date(order.created_at).toLocaleString()}</div>
        </div>

        <div class="history-note">Items in this order</div>
        ${renderGroupItemsWithDelete(groupItems)}

        <div class="history-note">Edit selected line item (${ITEM_LABEL[order.item_type] || order.item_type})</div>
        <div class="update-row">
          <div class="field">
            <label>Quantity</label>
            <input type="number" min="1" id="qtySelect-${order.id}" value="${order.quantity}">
          </div>
          ${order.order_mode === 'once' ? `
          <div class="field">
            <label>Delivery date</label>
            <input type="date" id="dateSelect-${order.id}" value="${order.delivery_date || ''}">
          </div>` : `
          <div class="field">
            <label>Recurring day</label>
            <select id="daySelect-${order.id}">
              ${['mon','tue','wed','thu','fri','sat','sun'].map(d => `<option value="${d}" ${d===order.recurring_day?'selected':''}>${DAY_LABELS[d]}</option>`).join('')}
            </select>
          </div>`}
          <div class="field">
            <label>Status</label>
            <select id="statusSelect-${order.id}">
              ${['pending','confirmed','delivered','cancelled'].map(s => `<option value="${s}" ${s===order.status?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Payment</label>
            <select id="paymentSelect-${order.id}">
              ${['unpaid','claimed','confirmed'].map(s => `<option value="${s}" ${s===order.payment_status?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <button onclick="saveOrderUpdate('${order.id}', '${order.order_mode}')">Save</button>
          <button class="row-delete" onclick="deleteOrderLine('${order.id}', '${order.order_group_id}')">delete this item</button>
        </div>
        <div class="form-status" id="updateStatus-${order.id}"></div>

        <div class="history-note">This customer's other orders</div>
        ${renderOrdersTable(history)}
      </div>`;
  } catch (err){
    console.error('Order detail failed:', err);
    detailEl.innerHTML = `<p style="color:var(--bad); font-size:13.5px;">Could not load order details.</p>`;
  }
}

async function deleteOrderLine(orderId, groupId){
  if (!confirm('Delete this line item? This cannot be undone.')) return;
  try {
    const { error } = await db.from('orders').delete().eq('id', orderId);
    if (error) throw error;
    await loadAllOrders();
    document.getElementById('orderDetail').innerHTML = '';
  } catch (err){
    console.error('Delete failed:', err);
    alert(err.message || 'Could not delete this item.');
  }
}

async function deleteWholeOrder(groupId){
  if (!confirm('Delete the ENTIRE order (all items in this checkout)? This cannot be undone.')) return;
  try {
    const { error } = await db.from('orders').delete().eq('order_group_id', groupId);
    if (error) throw error;
    await loadAllOrders();
    document.getElementById('orderDetail').innerHTML = '';
  } catch (err){
    console.error('Delete failed:', err);
    alert(err.message || 'Could not delete this order.');
  }
}

async function saveOrderUpdate(orderId, orderMode){
  const statusEl = document.getElementById(`updateStatus-${orderId}`);
  const newStatus = document.getElementById(`statusSelect-${orderId}`).value;
  const newPayment = document.getElementById(`paymentSelect-${orderId}`).value;
  const newQty = parseInt(document.getElementById(`qtySelect-${orderId}`).value, 10);
  statusEl.textContent = 'Saving…'; statusEl.className = 'form-status';

  if (!newQty || newQty < 1){
    statusEl.textContent = 'Quantity must be at least 1.'; statusEl.className = 'form-status err'; return;
  }

  const fields = { status: newStatus, payment_status: newPayment, quantity: newQty };
  if (orderMode === 'once'){
    fields.delivery_date = document.getElementById(`dateSelect-${orderId}`).value;
  } else {
    fields.recurring_day = document.getElementById(`daySelect-${orderId}`).value;
  }

  try {
    const { error } = await db.from('orders').update(fields).eq('id', orderId);
    if (error) throw error;
    statusEl.textContent = 'Saved.'; statusEl.className = 'form-status ok';
    loadAllOrders();
  } catch (err){
    console.error('Update failed:', err);
    statusEl.textContent = err.message || 'Could not save.';
    statusEl.className = 'form-status err';
  }
}

// =========================================================================
// CUSTOMERS
// =========================================================================
let allCustomersCache = [];

async function loadAllCustomers(){
  const wrap = document.getElementById('customersTableWrap');
  wrap.innerHTML = '<p style="color:#8A97A0; font-size:13.5px;">Loading…</p>';
  try {
    const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allCustomersCache = data || [];
    wrap.innerHTML = `
      <table class="orders-table">
        <thead><tr><th>Name</th><th>Hostel</th><th>Room</th><th>Phone</th></tr></thead>
        <tbody>
          ${allCustomersCache.map(p => `
            <tr class="clickable" onclick="openCustomerDetail('${p.id}')">
              <td>${p.full_name}</td>
              <td>${p.hostel}</td>
              <td>${p.room_number}${p.wing}</td>
              <td>${p.phone}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err){
    console.error('Load customers failed:', err);
    wrap.innerHTML = `<p style="color:var(--bad); font-size:13.5px;">Could not load customers.</p>`;
  }
}

async function openCustomerDetail(customerId){
  const detailEl = document.getElementById('customerDetail');
  const profile = allCustomersCache.find(p => p.id === customerId);
  if (!profile) return;

  detailEl.innerHTML = '<p style="color:#8A97A0; font-size:13.5px;">Loading…</p>';
  try {
    const { data: orders, error } = await db.from('orders').select('*').eq('customer_id', customerId).order('created_at', { ascending: false });
    if (error) throw error;

    detailEl.innerHTML = `
      <div class="order-detail">
        <h4>${profile.full_name}</h4>
        <div class="update-row">
          <div class="field"><label>Name</label><input type="text" id="editName-${profile.id}" value="${profile.full_name}"></div>
          <div class="field"><label>Hostel</label><input type="text" id="editHostel-${profile.id}" value="${profile.hostel}"></div>
          <div class="field"><label>Room</label><input type="text" id="editRoom-${profile.id}" value="${profile.room_number}"></div>
          <div class="field">
            <label>Wing</label>
            <select id="editWing-${profile.id}">
              <option value="A" ${profile.wing==='A'?'selected':''}>A</option>
              <option value="B" ${profile.wing==='B'?'selected':''}>B</option>
            </select>
          </div>
          <div class="field"><label>Phone</label><input type="text" id="editPhone-${profile.id}" value="${profile.phone}"></div>
          <button onclick="saveCustomerEdit('${profile.id}')">Save</button>
        </div>
        <div class="form-status" id="customerEditStatus-${profile.id}"></div>

        <div class="history-note">Order history</div>
        ${renderOrdersTable(orders)}
      </div>`;
  } catch (err){
    console.error('Customer detail failed:', err);
    detailEl.innerHTML = `<p style="color:var(--bad); font-size:13.5px;">Could not load this customer.</p>`;
  }
}

async function saveCustomerEdit(customerId){
  const statusEl = document.getElementById(`customerEditStatus-${customerId}`);
  const fields = {
    full_name: document.getElementById(`editName-${customerId}`).value.trim(),
    hostel: document.getElementById(`editHostel-${customerId}`).value.trim(),
    room_number: document.getElementById(`editRoom-${customerId}`).value.trim(),
    wing: document.getElementById(`editWing-${customerId}`).value,
    phone: document.getElementById(`editPhone-${customerId}`).value.trim()
  };
  statusEl.textContent = 'Saving…'; statusEl.className = 'form-status';
  try {
    const { error } = await db.from('profiles').update(fields).eq('id', customerId);
    if (error) throw error;
    statusEl.textContent = 'Saved.'; statusEl.className = 'form-status ok';
    loadAllCustomers();
  } catch (err){
    console.error('Customer update failed:', err);
    statusEl.textContent = err.message || 'Could not save.';
    statusEl.className = 'form-status err';
  }
}

// ---- init ----
if (db){
  refreshSession();
  db.auth.onAuthStateChange((_event, _session) => { refreshSession(); });
} else {
  renderAdminGate();
}
</script>
</body>
</html>
